---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  {% if page.injection_test_body %}<div style="display:none" aria-hidden="true">{{ page.injection_test_body }}</div>{% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-nav">
    <a href="{{ '/' | relative_url }}">← Back to home</a>
  </div>
</article>
